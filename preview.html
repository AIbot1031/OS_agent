<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>題庫側邊欄預覽</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;color:#172337;background:#f3f5f8}
    .app{display:flex;min-height:100vh}.practice{flex:1;padding:56px max(24px,7vw);overflow:auto;background:#111a27 url("assets/battle-bg.png") center center/cover no-repeat}
    .sheet{max-width:850px;margin:auto;padding:36px;background:#fffffff0;border-radius:14px;box-shadow:0 8px 28px #16233b30}
    .factions{display:flex;justify-content:space-between;gap:12px;max-width:850px;margin:0 auto 22px}.faction{padding:8px 14px;background:#0b1425d9;border:1px solid #4a6684;color:#fff;font-weight:800;letter-spacing:.08em;border-radius:6px}.faction.os{border-color:#48cfff;color:#b3edff}.faction.algo{border-color:#ff9b40;color:#ffd1a6}
    .eyebrow{color:#1769cf;font-weight:700}.sheet h1{font-size:28px}.question{margin-top:32px;padding:22px;border:1px solid #dae1ec;border-left:4px solid #e94c59;border-radius:8px}
    .preview-note{color:#66758a;font-size:14px}.side{width:400px;min-width:330px;background:white;border-left:1px solid #dae1ec;box-shadow:-8px 0 20px #16233b0c;height:100vh;overflow:auto;position:sticky;top:0}
    .head{padding:18px 20px;background:#1769cf;color:white}.head h2{margin:0;font-size:20px}.head p{margin:2px 0 0;font-size:13px}
    .body{padding:18px}.body label{font-weight:700;display:block;margin:12px 0 6px}.body select,.body textarea{width:100%;padding:10px;border:1px solid #bac8d7;border-radius:7px;font:inherit;background:#fff;color:#172337}
    .body select option{background:#fff;color:#172337}
    .body textarea{height:100px;resize:vertical}.body button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:7px;background:#1769cf;color:white;font:inherit;cursor:pointer}
    .body button.secondary{background:#e7eef8;color:#174f91}.body button:focus-visible,.body textarea:focus-visible,.body select:focus-visible{outline:3px solid orange}
    #status{color:#52647a;font-size:13px;min-height:20px}.result{border:1px solid #dce4ec;border-radius:8px;padding:13px;margin:10px 0;overflow-wrap:anywhere}.result h3{font-size:15px;margin:0 0 8px}.result p{white-space:pre-wrap;margin:8px 0 0}.meta{color:#62728a;font-size:12px}
    .answer-block{margin-top:10px;padding:10px;border-left:4px solid #15925c;border-radius:6px;background:#e3f8ec;color:#104f36}.answer-block p{font-weight:700}.answer-block ul{margin:6px 0 0;padding-left:22px}.answer-block li{margin:3px 0;font-weight:650}
    @media(max-width:750px){.app{display:block}.practice{padding:20px}.side{width:100%;height:auto;min-width:0;position:static}.sheet{padding:20px}}
  </style>
</head>
<body>
  <div class="app">
    <main class="practice">
      <div class="factions" aria-label="OS 與演算法陣營"><span class="faction os">OS｜核心防線</span><span class="faction algo">演算法｜排序攻勢</span></div>
      <div class="sheet">
        <p class="eyebrow">預覽用題目畫面</p>
        <h1>演算法練習</h1>
        <p class="preview-note">左側只是示意頁面。右側可用內建 1,397 題試搜尋。</p>
        <div class="question">
          <strong>題目</strong>
          <p id="sample">若一排序演算法在重排陣列時，最多僅需常數個額外記憶體空間在陣列外，此演算法被稱為 [__1__] 排序。</p>
        </div>
      </div>
    </main>
    <aside class="side" aria-label="題庫側邊欄預覽">
      <div class="head"><h2>題庫搜尋</h2><p>側邊欄預覽</p></div>
      <div class="body">
        <label for="subject">科目</label>
        <select id="subject"><option value="">全部科目</option><option value="algorithm">演算法</option><option value="os">作業系統</option></select>
        <label for="unit">網站單元</label>
        <select id="unit"><option value="">全部單元</option></select>
        <label for="chapter">主題標籤</label>
        <select id="chapter"><option value="">全部主題</option></select>
        <label for="query">搜尋題目或關鍵字</label>
        <textarea id="query">演算法 重排</textarea>
        <button id="search">搜尋</button>
        <button id="sampleSearch" class="secondary">用左側題目搜尋</button>
        <p id="status" role="status"></p>
        <div id="results"></div>
      </div>
    </aside>
  </div>
  <script src="search.js"></script>
  <script src="preview.js"></script>
</body>
</html>
