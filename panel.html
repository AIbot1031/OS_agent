<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>題庫搜尋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>題庫搜尋</h1>
    <p>截圖辨識並查找相似題目</p>
  </header>
  <nav class="views" aria-label="側邊欄檢視">
    <button id="showSite" class="view active" aria-pressed="true">題庫網站</button>
    <button id="showSite2" class="view" aria-pressed="false">題庫網站 2</button>
    <button id="showSearch" class="view" aria-pressed="false">本機搜尋</button>
  </nav>
  <section id="siteView" class="site-view">
    <p class="site-help">在右側直接瀏覽題庫網站。若網站拒絕嵌入，請切換「本機搜尋」。</p>
    <iframe id="bankSite" title="演算法與作業系統學習題庫" src="https://os-study-notebook.shij.chatgpt.site/"></iframe>
    <button id="openSite" class="secondary site-open">在新分頁開啟題庫網站</button>
  </section>
  <section id="site2View" class="site-view" hidden>
    <div class="site-settings">
      <label for="site2Name">頁籤名稱</label>
      <input id="site2Name" type="text" value="題庫網站 2" maxlength="20">
      <label for="site2Url">第二個題庫網站網址</label>
      <input id="site2Url" type="url" placeholder="https://example.com/" inputmode="url">
      <button id="saveSite2">儲存並開啟網站</button>
      <p id="site2Status" role="status"></p>
    </div>
    <iframe id="bankSite2" title="第二個題庫網站" hidden></iframe>
    <button id="openSite2" class="secondary site-open" hidden>在新分頁開啟第二個題庫網站</button>
  </section>
  <main id="searchView" hidden>
    <section class="controls">
      <h2>截圖搜尋</h2>
      <button id="capture">擷取目前畫面並搜尋</button>
      <div id="pasteZone" class="paste-zone" tabindex="0" role="button" aria-label="貼上題目截圖">
        點這裡，再按 Ctrl+V 貼上截圖
      </div>
      <label for="imageFile">或上傳題目截圖</label>
      <input id="imageFile" type="file" accept="image/*">
      <p id="bankCount" class="muted">題庫載入中…</p>
      <p id="status" role="status" aria-live="polite"></p>
      <details id="recognizedText">
        <summary>查看辨識出的文字</summary>
        <pre id="ocrText"></pre>
      </details>
    </section>
    <section>
      <h2>搜尋結果</h2>
      <div id="results"></div>
    </section>
    <details id="bankManage" class="controls">
      <summary>題庫管理（匯入與網站同步）</summary>
      <label for="bankFile">加入題庫（HTML、JSON、CSV 或 TSV）</label>
      <input id="bankFile" type="file" accept=".html,.htm,.json,.csv,.tsv,text/html,application/json,text/csv,text/tab-separated-values">
      <button id="syncSite" class="secondary">從題庫網站同步最新題目</button>
      <p id="manageStatus" role="status" aria-live="polite"></p>
    </details>
  </main>
  <script src="search.js"></script>
  <script src="vendor/ocr/tesseract.min.js"></script>
  <script src="ocr.js"></script>
  <script src="panel.js"></script>
</body>
</html>
