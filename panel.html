<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>題庫搜尋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>題庫搜尋</h1>
    <p>從目前頁面找相似題目</p>
  </header>
  <nav class="views" aria-label="側邊欄檢視">
    <button id="showSite" class="view active" aria-pressed="true">題庫網站</button>
    <button id="showSearch" class="view" aria-pressed="false">本機搜尋</button>
  </nav>
  <section id="siteView" class="site-view">
    <p class="site-help">在右側直接瀏覽題庫網站。若網站拒絕嵌入，請切換「本機搜尋」。</p>
    <iframe id="bankSite" title="演算法與作業系統學習題庫" src="https://os-study-notebook.shij.chatgpt.site/"></iframe>
    <button id="openSite" class="secondary site-open">在新分頁開啟題庫網站</button>
  </section>
  <main id="searchView" hidden>
    <section class="controls">
      <label for="bankFile">加入題庫（HTML、JSON、CSV 或 TSV）</label>
      <input id="bankFile" type="file" accept=".html,.htm,.json,.csv,.tsv,text/html,application/json,text/csv,text/tab-separated-values">
      <p id="bankCount" class="muted">尚未匯入題庫</p>
      <button id="scan">搜尋目前頁面</button>
      <button id="capture" class="secondary">截圖辨識並搜尋</button>
      <label for="imageFile">或上傳題目截圖</label>
      <input id="imageFile" type="file" accept="image/*">
      <label for="subject">科目</label>
      <select id="subject"><option value="">全部科目</option><option value="algorithm">演算法</option><option value="os">作業系統</option></select>
      <label for="unit">網站單元</label>
      <select id="unit"><option value="">全部單元</option></select>
      <label for="chapter">主題標籤</label>
      <select id="chapter"><option value="">全部主題</option></select>
      <label for="query">或輸入題目關鍵字</label>
      <textarea id="query" rows="3" placeholder="貼上題目或輸入關鍵字"></textarea>
      <button id="search" class="secondary">搜尋文字</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section>
      <h2>搜尋結果</h2>
      <div id="results"></div>
    </section>
  </main>
  <script src="search.js"></script>
  <script src="vendor/ocr/tesseract.min.js"></script>
  <script src="ocr.js"></script>
  <script src="panel.js"></script>
</body>
</html>
